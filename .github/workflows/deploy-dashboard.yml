name: Build Dashboard

on:
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install

      - run: npm run build --workspace=apps/dashboard

      # Deployment is intentionally separate until a hosting provider and
      # environment-specific runtime configuration are selected.
